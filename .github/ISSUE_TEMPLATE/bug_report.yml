name: Bug report
description: Something in ferris or the project-state skill doesn't work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please don't paste real client documents, emails or project state; describe them or use made-up examples.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ferris new project-state "Demo" --folder ./docs -y
        2. In Claude Code: "start tracking Demo with the project-state skill"
        3. ...
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Agent
      multiple: true
      options: [Claude Code, Codex, Cursor, none (the CLI itself)]
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `ferris doctor`
      render: text
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15, Ubuntu 24.04, Windows 11 (WSL)...
