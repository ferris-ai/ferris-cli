<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 840" width="1120" height="840" role="img" aria-label="Four ways to give an agent the history of a project, asked when the dashboard handover is: alone it can't tell; with everything in context it sees both dates and nothing says which is current; with a memory bank it gets the best-matching record with no change history; with a project state it answers 27 March, was 20 March, with the quote that changed it" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#1f2937">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2e8b57"/></marker>
<g id="page"><rect width="56" height="66" rx="5" fill="#ffffff" stroke="#6b7280" stroke-width="2"/><path d="M10 16 H46 M10 28 H46 M10 40 H46 M10 52 H32" stroke="#9ca3af" stroke-width="3" stroke-linecap="round"/></g>
</defs>
<rect width="1120" height="840" rx="16" fill="#ffffff"/>
<text x="560" y="44" font-size="24" font-weight="700" fill="#1f2937" text-anchor="middle">Asked of the agent: “When is the dashboard handover?”</text>
<g transform="translate(30,-20)">
<use href="#page" x="22" y="162"/>
<text x="10" y="254" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">latest</text>
<text x="10" y="274" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">message</text>
<rect x="140" y="120" width="80" height="160" rx="10" fill="#b9e3a4" stroke="#3a9a5b" stroke-width="2.5"/>
<text x="180" y="207" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">Agent</text>
<path d="M86 195 H136" stroke="#6b7280" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
<path d="M220 200 H241" stroke="#6b7280" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
<rect x="245" y="125" width="280" height="150" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
<text x="259" y="158" font-size="20" font-weight="700" fill="#1f2937" text-anchor="start">Can't tell</text>
<text x="259" y="186" font-size="17" font-weight="400" fill="#374151" text-anchor="start">it sees one message,</text>
<text x="259" y="211" font-size="17" font-weight="400" fill="#374151" text-anchor="start">with no handover date</text>
<text x="262" y="366" font-size="21" font-weight="700" fill="#1f2937" text-anchor="middle">(a) Agent alone</text>
</g>
<g transform="translate(585,-20)">
<use href="#page" x="10" y="150"/>
<use href="#page" x="16" y="156"/>
<use href="#page" x="22" y="162"/>
<text x="10" y="254" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">all threads</text>
<text x="10" y="274" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">pasted in</text>
<rect x="140" y="120" width="80" height="160" rx="10" fill="#b9e3a4" stroke="#3a9a5b" stroke-width="2.5"/>
<text x="180" y="207" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">Agent</text>
<path d="M86 195 H136" stroke="#6b7280" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
<path d="M220 200 H241" stroke="#6b7280" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
<rect x="245" y="125" width="280" height="150" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
<text x="259" y="158" font-size="20" font-weight="700" fill="#1f2937" text-anchor="start">20 Mar or 27 Mar?</text>
<text x="259" y="186" font-size="17" font-weight="400" fill="#374151" text-anchor="start">both are in context;</text>
<text x="259" y="211" font-size="17" font-weight="400" fill="#374151" text-anchor="start">nothing says which</text>
<text x="259" y="236" font-size="17" font-weight="400" fill="#374151" text-anchor="start">one is current</text>
<text x="262" y="366" font-size="21" font-weight="700" fill="#1f2937" text-anchor="middle">(b) Agent + everything in context</text>
</g>
<g transform="translate(30,400)">
<use href="#page" x="10" y="150"/>
<use href="#page" x="16" y="156"/>
<use href="#page" x="22" y="162"/>
<text x="10" y="254" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">every</text>
<text x="10" y="274" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">message</text>
<rect x="140" y="120" width="80" height="160" rx="10" fill="#b9e3a4" stroke="#3a9a5b" stroke-width="2.5"/>
<text x="180" y="207" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">Agent</text>
<path d="M86 195 H136" stroke="#6b7280" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
<rect x="165" y="0" width="240" height="72" rx="8" fill="#fff3c4" stroke="#d9a21b" stroke-width="2"/>
<text x="285" y="30" font-size="19" font-weight="700" fill="#1f2937" text-anchor="middle">Memory bank</text>
<text x="285" y="55" font-size="16" font-weight="400" fill="#374151" text-anchor="middle">messages stored as records</text>
<path d="M44 146 V36 H161" stroke="#6b7280" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
<path d="M190 72 V116" stroke="#6b7280" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
<path d="M210 118 V76" stroke="#6b7280" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
<path d="M220 200 H241" stroke="#6b7280" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
<rect x="245" y="125" width="280" height="150" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
<text x="259" y="158" font-size="20" font-weight="700" fill="#1f2937" text-anchor="start">Best-matching record</text>
<text x="259" y="186" font-size="17" font-weight="400" fill="#374151" text-anchor="start">maybe the 20 Mar kickoff,</text>
<text x="259" y="211" font-size="17" font-weight="400" fill="#374151" text-anchor="start">with no change history</text>
<text x="262" y="366" font-size="21" font-weight="700" fill="#1f2937" text-anchor="middle">(c) Agent + a memory bank of records</text>
</g>
<g transform="translate(585,400)">
<rect x="-10" y="-12" width="545" height="392" rx="14" fill="#f0faf3" stroke="#3a9a5b" stroke-width="2.5"/>
<use href="#page" x="10" y="150"/>
<use href="#page" x="16" y="156"/>
<use href="#page" x="22" y="162"/>
<text x="10" y="254" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">every</text>
<text x="10" y="274" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">document</text>
<rect x="140" y="120" width="80" height="160" rx="10" fill="#b9e3a4" stroke="#3a9a5b" stroke-width="2.5"/>
<text x="180" y="207" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">Agent</text>
<rect x="165" y="0" width="240" height="96" rx="8" fill="#fff3c4" stroke="#d9a21b" stroke-width="2.5"/>
<text x="285" y="30" font-size="19" font-weight="700" fill="#1f2937" text-anchor="middle">Project state</text>
<text x="285" y="55" font-size="16" font-weight="400" fill="#374151" text-anchor="middle">facts, versions and quotes,</text>
<text x="285" y="78" font-size="16" font-weight="400" fill="#374151" text-anchor="middle">updated as documents arrive</text>
<path d="M44 146 V48 H161" stroke="#2e8b57" stroke-width="2.5" fill="none" marker-end="url(#ag)"/>
<path d="M200 96 V116" stroke="#2e8b57" stroke-width="2.5" fill="none" marker-end="url(#ag)"/>
<path d="M220 200 H241" stroke="#2e8b57" stroke-width="2.5" fill="none" marker-end="url(#ag)"/>
<rect x="245" y="125" width="280" height="150" rx="10" fill="#e6f4ea" stroke="#3a9a5b" stroke-width="2.5"/>
<text x="259" y="158" font-size="20" font-weight="700" fill="#1f2937" text-anchor="start">27 Mar (was 20 Mar)</text>
<text x="259" y="186" font-size="17" font-weight="400" fill="#374151" text-anchor="start">Sam, 12 Mar:</text>
<text x="259" y="211" font-size="16" font-weight="400" fill="#374151" text-anchor="start" font-style="italic">“Confirmed: add live ETA, and</text>
<text x="259" y="236" font-size="16" font-weight="400" fill="#374151" text-anchor="start" font-style="italic">a handover on 2026-03-27 is fine.”</text>
<path d="M385 275 V308 H-2 V200 H6" stroke="#2e8b57" stroke-width="2.5" fill="none" stroke-dasharray="8 6" marker-end="url(#ag)"/>
<text x="262" y="334" font-size="16" font-weight="700" fill="#1e6b3a" text-anchor="middle">the work moves on: new documents arrive, the state is updated</text>
<text x="262" y="366" font-size="21" font-weight="700" fill="#1e6b3a" text-anchor="middle">(d) Agent + project state (this skill)</text>
</g>
<text x="560" y="812" font-size="15" font-weight="400" fill="#6b7280" text-anchor="middle">Illustrative, using the Northwind sample project. Panels (a) to (c) show what each approach has to work from, not a measured result.</text>
</svg>
